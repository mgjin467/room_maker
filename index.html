<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f1f0ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>방 가구 배치 3D 시뮬레이터</title>
<link rel="stylesheet" href="/src/style.css">
</head><body>
<div id="app">
  <div id="v"><canvas id="c"></canvas>
    <div id="tb">
      <div class="grp vgrp"><button data-v="door">입구</button><button data-v="iso">대각선</button><button data-v="top">위</button><button data-v="plan" title="직교 평면도 (2D)">평면도</button><button data-v="eye0" title="방 안 눈높이 시점">눈높이</button></div>
      <select id="vsel" class="grp vsel" aria-label="시점"><option value="door">입구 시점</option><option value="iso">대각선</option><option value="isoL">대각선 (왼쪽)</option><option value="top">위에서</option><option value="plan">평면도 2D</option><option value="eye0">눈높이 1</option><option value="eye1">눈높이 2</option><option value="eye2">눈높이 3</option><option value="eye3">눈높이 4</option></select>
      <div class="grp"><button id="undo" title="실행 취소 (Ctrl+Z)">↶</button><button id="redo" title="다시 실행 (Ctrl+Y)">↷</button></div>
      <div class="grp tools"><button id="mz" title="줄자: 바닥 두 점 클릭">📏<span class="t"> 줄자</span></button><button id="night">🌙<span class="t"> 야간</span></button><button id="shot" title="3D 화면 PNG 저장">📷</button></div>
      <details class="grp menu" id="dd"><summary>☰<span class="t"> 표시</span></summary><div id="ddm"></div></details>
      <span id="sync" class="sync local" role="button" tabindex="0" title="저장"><span class="dot"></span><span class="i">💾</span><span class="t">저장</span></span>
    </div>
    <div id="qb" hidden>
      <b id="qbn"></b>
      <button class="qi" data-q="m" title="5% 작게">−</button><input class="qi" id="qbp" type="number" inputmode="decimal" min="1" step="5" title="전체 크기 % (기본 대비)"><span class="qi">%</span><button class="qi" data-q="p" title="5% 크게">+</button>
      <button data-q="rot" title="회전 (45°·90°·180°·직접 입력)">⟳ 회전</button><button data-q="dup" title="복제 (Ctrl+D)">복제</button><button class="qi" data-q="lock" title="잠금">🔓</button><button data-q="edit" title="상세 편집">편집</button><button data-q="del" title="삭제 (Del)">삭제</button>
      <div id="qbrot" hidden></div>
    </div>
    <div id="fab"><button id="fabCam" title="사진으로 가구 추가">📷</button><button id="fabAI" title="AI 대화">🤖</button><button id="fabAdd" title="가구 추가">＋</button></div>
    <div id="hint"></div>
    <div id="toast" hidden></div>
  </div>
  <aside id="p">
    <div id="grab" aria-label="패널 크기 조절"><span></span></div>
    <nav id="tabs"><button data-t="add"><i>＋</i>추가</button><button data-t="sel"><i>✎</i>선택</button><button data-t="room"><i>⌂</i>방·창호</button><button data-t="light"><i>💡</i>조명</button><button data-t="ai"><i>🤖</i>AI</button><button data-t="list"><i>☰</i>목록</button><button data-t="file"><i>☁</i>저장</button></nav>
    <section id="t-add">
      <div id="acct"></div>
      <input type="search" id="q" placeholder="가구·소품·사람 검색 (예: 소파, 화분, 스탠드)">
      <div id="pre"></div>
      <div class="r"><button class="o" id="addc">+ 직접 입력 가구 (박스)</button></div>
      <p class="mu sm">● 표시는 사용자가 바꾼 크기가 저장된 항목입니다. 다음에 추가할 때 그 크기로 들어갑니다.</p>
    </section>
    <section id="t-sel" hidden></section>
    <section id="t-room" hidden></section>
    <section id="t-light" hidden></section>
    <section id="t-ai" hidden></section>
    <section id="t-list" hidden></section>
    <section id="t-file" hidden></section>
  </aside>
</div>
<div id="pr"></div>
<script type="module" src="/src/main.js"></script>
</body></html>
